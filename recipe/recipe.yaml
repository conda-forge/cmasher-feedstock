schema_version: 1

context:
  python_min: "3.10"
  name: cmasher
  version: "1.9.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 6c90c2cec87146e3210d3e7f2321fceee38ac7d87c136cd0de25160a14f57ff5

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - cmr = cmasher.cli_tools:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - colorspacious >=1.1.0
    - matplotlib-base >=3.5.0
    - numpy >=1.21.2

tests:
  - python:
      imports:
        - cmasher
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests
        - conftest.py
    requirements:
      run:
        - pip
        - pytest
        - pytest-mpl
        - python ${{ python_min }}.*
    script:
      - cmr --help
      - pytest -ra tests

about:
  summary: Scientific colormaps for making accessible, informative and 'cmashing' plots
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://cmasher.readthedocs.io

extra:
  recipe-maintainers:
    - neutrinoceros
    - 1313e
